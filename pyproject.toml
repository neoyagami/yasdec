[project]
name = "sdeck"
version = "1.0.0"
description = "YASDEC — Yet Another Stream Deck Controller"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.7", "Pillow>=10", "evdev>=1.7"]

[project.optional-dependencies]
hardware = ["streamdeck>=0.9.6"]

[project.scripts]
sdeck = "sdeck.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
